handoff_transport: file
completion_mode: helper
artifacts:
  forward: produced_or_incoming
  max_files_per_turn: 8
  max_file_bytes: 1048576
  max_turn_bytes: 4194304
  max_run_files: 64
  max_run_bytes: 33554432
  keep: false

initial: >-
  執行 reviewer/fixer 閉環。Reviewer 先檢查目前 git diff 並發布完整 review handoff
  artifact；fixer 讀取 incoming artifacts 後修復與補測試，再交回 reviewer。

initial_pane1: >-
  檢查目前 git diff 的 correctness、完整性與測試覆蓋，將完整報告發布至本輪 artifact
  outbox；只做 review，不修改產品檔案。

initial_pane2: >-
  讀取 runner 提供的 incoming artifacts，逐項修復有效問題、補回歸測試並執行驗證。

pane1_role: >-
  你是嚴格且唯讀的 reviewer。檢查目前 git diff 與測試，不修改產品檔案；將完整的
  findings 發布成新的 review artifact。artifact 的 relpath 必須是相對於 outbox 的檔名，
  例如 review-summary.md，不要加上 outbox/ 前綴。只有你能核准整體完成。

pane2_role: >-
  你是 fixer。讀取 incoming artifacts，逐項修正有效 findings、補足回歸測試並執行驗證；
  修復後交回 reviewer 複查。artifact 的 relpath 必須是相對於 outbox 的檔名，
  例如 fix-summary.md，不要加上 outbox/ 前綴。

to_pane1_prompt: >-
  重新 review 最新 git diff 與測試證據，並發布本輪的新 review artifact；artifact relpath
  必須是相對於 outbox 的檔名，不要加上 outbox/ 前綴。

to_pane2_prompt: >-
  讀取 incoming artifacts，修正其中的有效 findings 並補足測試；artifact relpath 必須是
  相對於 outbox 的檔名，不要加上 outbox/ 前綴。

coordinator: false
routing:
  mode: state_machine
  initial_member: pane1
  transitions:
    pane1:
      success: {action: stop}
      needs_followup: {action: send, target: pane2}
      blocked: {action: needs_human}
    pane2:
      success: {action: send, target: pane1}
      needs_followup: {action: send, target: pane1}
      blocked: {action: needs_human}
stop_members:
  - pane1
coordinator_policy: |-
  初始工作交給 pane1 reviewer。pane1 回報 outcome=needs_followup 時交給 pane2；
  pane2 完成後一律交回 pane1 複查。只有 pane1 回報 outcome=success 且證據充分時
  才能 stop。outcome=blocked 時使用 needs_human。
coordinator_timeout: 600
max_selection_retries: 2
# Review/fix agents can legitimately run full test and race suites for longer
# than a fixed budget. Completion is receipt-driven; zero disables only the
# wall-clock cutoff, not the validated receipt/marker protocol.
round_timeout: 0
screen_idle_timeout: 60
screen_idle_normalize: true
submit_delay: 3000
lines: 1000

# LLM meter only examines the bottom terminal rows at validated handoff
# boundaries. It fails closed on uncertain or unavailable context readings.
compaction:
  enabled: true
  mode: threshold
  min_rounds_between: 3
  context_meter:
    mode: llm
    bottom_lines: 16
    llm_min_confidence: 0.85
